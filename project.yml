name: ExpenseTracker
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources: [ExpenseTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ExpenseTracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExpenseTrackerTests]
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
    test:
      targets: [ExpenseTrackerTests]
